<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Pre Use Deviation</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        body {
            margin: 0;
            background: #f3f4f6;
            font-family: Arial, sans-serif;
            color: #111827;
        }

        .page {
            max-width: 1200px;
            margin: 24px auto;
            background: #ffffff;
            border-radius: 14px;
            padding: 22px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
        }

        .header {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid #e5e7eb;
            padding-bottom: 14px;
        }

        .title {
            margin: 0;
            font-size: 26px;
            font-weight: 700;
            color: #991b1b;
        }

        .subtitle {
            margin-top: 6px;
            color: #6b7280;
            font-size: 14px;
        }

        .btn-list {
            display: inline-block;
            background: #374151;
            color: white;
            text-decoration: none;
            padding: 10px 14px;
            border-radius: 8px;
            font-weight: 600;
        }

        form {
            margin: 0;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 13px;
            font-weight: 700;
            color: #374151;
        }

        input,
        select,
        textarea {
            width: 100%;
            box-sizing: border-box;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            padding: 10px 11px;
            font-size: 14px;
            background: white;
            color: #111827;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        .full {
            grid-column: 1 / -1;
        }

        .section {
            margin-top: 22px;
            padding-top: 18px;
            border-top: 1px solid #e5e7eb;
        }

        .section-title {
            margin: 0 0 14px 0;
            font-size: 18px;
            color: #111827;
        }

        .actions {
            margin-top: 22px;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .btn-save {
            background: #991b1b;
            border: 0;
            color: white;
            padding: 12px 18px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-reset {
            background: #6b7280;
            color: white;
            text-decoration: none;
            padding: 12px 18px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 700;
        }

        .completion-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .completion-row input[type="range"] {
            flex: 1;
        }

        .completion-value {
            min-width: 48px;
            text-align: right;
            font-weight: 700;
        }

        .hint {
            font-size: 12px;
            color: #6b7280;
        }

        @media (max-width: 760px) {
            .page {
                margin: 10px;
                padding: 14px;
            }

            .header {
                flex-direction: column;
                align-items: flex-start;
            }

            .grid {
                grid-template-columns: 1fr;
            }

            .title {
                font-size: 22px;
            }
        }
    </style>
</head>

<body>
<div class="page">
    <div class="header">
        <div>
            <h1 class="title">Pre Use Deviation</h1>
            <div class="subtitle">Supplier capture page</div>
        </div>
        <a class="btn-list" href="/pre_use_deviation_list">View List</a>
    </div>

    <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token or '' }}">
        <input type="hidden" name="name" value="{{ form_values.name or '' }}">

        <div class="grid">
            <div class="field">
                <label>Report Date & Time</label>
                <input type="text" name="report_datetime" value="{{ form_values.report_datetime or '' }}" required>
                <div class="hint">Format: DD-MM-YYYY HH:MM:SS</div>
            </div>

            <div class="field">
                <label>Site</label>
                <select name="site" id="site" required>
                    <option value="">Select Site</option>
                    {% for site in site_options %}
                    <option value="{{ site }}" {% if form_values.site == site %}selected{% endif %}>{{ site }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="field">
                <label>Fleet Number</label>
                <select name="fleet_number" id="fleet_number" required>
                    <option value="">Select Fleet Number</option>
                    {% for asset in asset_options %}
                    <option value="{{ asset }}" {% if form_values.fleet_number == asset %}selected{% endif %}>{{ asset }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="field">
                <label>Pre Use No</label>
                <input type="number" name="pre_use_no" value="{{ form_values.pre_use_no or 0 }}">
            </div>

            <div class="field">
                <label>Machine Type</label>
                <input type="text" name="machine_type" id="machine_type" value="{{ form_values.machine_type or '' }}">
            </div>

            <div class="field">
                <label>Machine Model</label>
                <input type="text" name="machine_model" id="machine_model" value="{{ form_values.machine_model or '' }}">
            </div>

            <div class="field">
                <label>Operating Status</label>
                <select name="operating_status">
                    <option value="">Select Operating Status</option>
                    {% for status in operating_status_options %}
                    <option value="{{ status }}" {% if form_values.operating_status == status %}selected{% endif %}>{{ status }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="field">
                <label>Action Status</label>
                <select name="action_status">
                    {% for status in action_status_options %}
                    <option value="{{ status }}" {% if form_values.action_status == status %}selected{% endif %}>{{ status }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="field full">
                <label>Deviation Details</label>
                <textarea name="deviation_details" required>{{ form_values.deviation_details or '' }}</textarea>
            </div>
        </div>

        <div class="section">
            <h2 class="section-title">Reported By</h2>

            <div class="grid">
                <div class="field">
                    <label>Reported By Coy Number</label>
                    <input type="text" name="reported_by_coy_number" value="{{ form_values.reported_by_coy_number or '' }}">
                </div>

                <div class="field">
                    <label>Reported By Name and Surname</label>
                    <input type="text" name="reported_by_name_and_surname" value="{{ form_values.reported_by_name_and_surname or '' }}">
                </div>
            </div>
        </div>

        <div class="section">
            <h2 class="section-title">Action / Resolution</h2>

            <div class="grid">
                <div class="field full">
                    <label>Resolution Summary</label>
                    <textarea name="resolution_summary">{{ form_values.resolution_summary or '' }}</textarea>
                </div>

                <div class="field">
                    <label>Action Date and Time</label>
                    <input type="text" name="action_date_and_time" value="{{ form_values.action_date_and_time or '' }}">
                    <div class="hint">Format: DD-MM-YYYY HH:MM:SS</div>
                </div>

                <div class="field">
                    <label>Actioned By Coy Number</label>
                    <input type="text" name="actioned_by_coy_number" value="{{ form_values.actioned_by_coy_number or '' }}">
                </div>

                <div class="field">
                    <label>Actioned By Name and Surname</label>
                    <input type="text" name="actioned_by_name_and_surname" value="{{ form_values.actioned_by_name_and_surname or '' }}">
                </div>

                <div class="field">
                    <label>Job Card Number</label>
                    <input type="text" name="job_card_number" value="{{ form_values.job_card_number or '' }}">
                </div>

                <div class="field">
                    <label>Completion Percentage</label>
                    <div class="completion-row">
                        <input type="range" min="0" max="100" step="1" name="completion_percentage" id="completion_percentage" value="{{ form_values.completion_percentage or 0 }}">
                        <span class="completion-value" id="completion_text">{{ form_values.completion_percentage or 0 }}%</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="actions">
            <button class="btn-save" type="submit">Save Pre Use Deviation</button>
            <a class="btn-reset" href="/pre_use_deviation_supplier">New</a>
        </div>
    </form>
</div>

<script>
const assetDetails = {{ asset_details | tojson }};

function updateAssetFields() {
    const fleet = document.getElementById("fleet_number").value;
    const details = assetDetails[fleet] || {};

    if (details.site) {
        document.getElementById("site").value = details.site;
    }

    if (details.machine_type) {
        document.getElementById("machine_type").value = details.machine_type;
    }

    if (details.machine_model) {
        document.getElementById("machine_model").value = details.machine_model;
    }
}

function updateCompletionText() {
    const value = document.getElementById("completion_percentage").value || 0;
    document.getElementById("completion_text").innerText = value + "%";
}

document.getElementById("fleet_number").addEventListener("change", updateAssetFields);
document.getElementById("completion_percentage").addEventListener("input", updateCompletionText);

updateAssetFields();
updateCompletionText();
</script>
</body>
</html>
