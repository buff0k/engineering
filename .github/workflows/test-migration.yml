name: Test bench migrate

on:
  push:
    branches: [main, jorrie, juan, kosie]
  workflow_run:
    workflows: ["Sync sub-branches with main"]
    types: [completed]

jobs:
  migrate-check:
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y wkhtmltopdf mariadb-client redis-tools

      - name: Install bench
        run: pip install frappe-bench

      - name: Init bench
        run: |
          bench init --skip-redis-config-generation --python $(which python3) frappe-bench
        working-directory: /home/runner/work

      - name: Configure bench to use service containers
        working-directory: /home/runner/work/frappe-bench
        run: |
          bench set-mariadb-host 127.0.0.1
          bench set-redis-cache-host redis://localhost:13000
          bench set-redis-queue-host redis://localhost:11000
          bench set-redis-socketio-host redis://localhost:11000

      - name: Get engineering app from this branch
        working-directory: /home/runner/work/frappe-bench
        run: |
          bench get-app engineering ${{ github.workspace }}

      - name: Create test site
        working-directory: /home/runner/work/frappe-bench
        run: |
          bench new-site test-site.local \
            --mariadb-root-password root \
            --admin-password admin \
            --no-mariadb-socket

      - name: Install app on test site
        working-directory: /home/runner/work/frappe-bench
        run: |
          bench --site test-site.local install-app engineering

      - name: Run bench migrate
        working-directory: /home/runner/work/frappe-bench
        run: |
          bench --site test-site.local migrate
